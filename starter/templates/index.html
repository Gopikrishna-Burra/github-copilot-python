<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <script>
    try {
      if (localStorage.getItem('sudokuTheme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (error) {
      // Light Mode remains the default when storage is unavailable.
    }
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <div class="timer">
      <span id="timer-label">Time</span>
      <time id="timer" aria-labelledby="timer-label" datetime="PT0M0S">00:00</time>
    </div>
    <label for="difficulty">Difficulty</label>
    <select id="difficulty" name="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="theme-toggle" type="button" aria-pressed="false">Switch to Dark Mode</button>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <span id="message" role="status" aria-live="polite"></span>
  </div>
  <div id="score-entry" hidden>
    <label for="player-name">Your name</label>
    <input id="player-name" type="text" maxlength="30" aria-describedby="score-error">
    <button id="save-score" type="button">Save Score</button>
    <span id="score-error" role="alert"></span>
  </div>
  <section class="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10 Scores</h2>
    <ol id="leaderboard-list"></ol>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
